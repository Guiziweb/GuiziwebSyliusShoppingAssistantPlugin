# Delete these routes and define your own shop routes here

guiziweb_sylius_shopping_assistant_static_welcome:
    path: /static-welcome/{name}
    defaults:
        _controller: Guiziweb\SyliusShoppingAssistantPlugin\Controller\GreetingController::staticallyGreetAction
        name: ~

guiziweb_sylius_shopping_assistant_dynamic_welcome:
    path: /dynamic-welcome/{name}
    defaults:
        _controller: Guiziweb\SyliusShoppingAssistantPlugin\Controller\GreetingController::dynamicallyGreetAction
        name: ~
